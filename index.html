<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ôn tập Chủ nghĩa xã hội khoa học</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ff;--card:#fff;--ink:#241b4b;--mut:#6c6490;--line:#e0daf5;--brand:#6a3df0;--brand2:#4a22c4;--ok:#1a9a5c;--bad:#e5484d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17122e;--card:#231c47;--ink:#f1edff;--mut:#a79fd0;--line:#382f6a;--brand:#8c68ff;--brand2:#a58aff}}
:root[data-theme="dark"]{--bg:#17122e;--card:#231c47;--ink:#f1edff;--mut:#a79fd0;--line:#382f6a;--brand:#8c68ff;--brand2:#a58aff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.55 Nunito,system-ui,sans-serif}
h1,h2,h3{font-family:"Baloo 2",Nunito,system-ui,sans-serif;margin:0;line-height:1.2}
.wrap{max-width:780px;margin:0 auto;padding:20px 16px 60px}
button{font:inherit;cursor:pointer;border:0;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.logo{font:800 26px "Baloo 2",sans-serif;color:var(--brand);cursor:pointer;margin-bottom:16px}
.hero{background:var(--brand);color:#fff;border-radius:22px;padding:24px;margin-bottom:20px}
.hero h1{font-size:clamp(24px,5.5vw,36px)}.hero p{margin:6px 0 0;opacity:.9}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px}
.card h3{font-size:19px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chip span{display:block;border:2px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:800}
.chip input:checked+span{background:var(--brand);border-color:var(--brand);color:#fff}
.chip input:focus-visible+span{outline:3px solid var(--brand);outline-offset:2px}
.chip small{font-weight:700;opacity:.8}
.btn{background:var(--brand);color:#fff;border-radius:14px;padding:12px 22px;font-weight:800;box-shadow:0 4px 0 var(--brand2)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brand2)}
.btn.g{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hud{display:flex;justify-content:space-between;gap:10px;font-weight:800;margin-bottom:8px;flex-wrap:wrap}
.pill{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:2px 14px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--brand)}
.qbox{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:20px;margin-bottom:14px}
.qbox h2{font-size:clamp(19px,3.8vw,25px);font-weight:700}
.ans{display:grid;gap:10px}
.a{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:13px 14px;font-weight:700;box-shadow:0 3px 0 var(--line)}
.a b{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:15px}
.a:nth-child(1) b{background:#e5484d}.a:nth-child(2) b{background:#2f6bff}.a:nth-child(3) b{background:#d99200}.a:nth-child(4) b{background:#1a9a5c}
.a.sel{border-color:var(--brand);background:rgba(106,61,240,.12)}
.a.ok{border-color:var(--ok);background:rgba(26,154,92,.16)}
.a.bad{border-color:var(--bad);background:rgba(229,72,77,.14)}
.a:disabled{cursor:default}
.fb{margin:14px 0;font-weight:800;padding:10px 14px;border-radius:12px}
.fb.nt{background:rgba(217,146,0,.16);color:var(--ink);font-weight:600}.fb.ok{background:rgba(26,154,92,.16);color:var(--ok)}.fb.bad{background:rgba(229,72,77,.14);color:var(--bad)}
.big{font:800 64px "Baloo 2",sans-serif;color:var(--brand);line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font:800 24px "Baloo 2",sans-serif}
.rv{border-left:5px solid var(--bad);background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.rv p{margin:0 0 6px;font-weight:800}.rv div{font-size:15px}
.rv .c{color:var(--ok);font-weight:800}.rv .w{color:var(--bad);font-weight:700}
input[type=number]{width:90px;font:700 16px Nunito,sans-serif;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 12px}label{font-weight:700}select{font:700 16px Nunito,sans-serif;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 12px}
label.r{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;font-weight:700}
label.r input{margin-top:5px;accent-color:var(--brand);width:18px;height:18px}
label.r small{display:block;color:var(--mut);font-weight:600}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const Q=[{"q": "Tác phẩm nào đánh dấu sự ra đời của chủ nghĩa xã hội khoa học?", "a": [["Hệ tư tưởng Đức", false], ["Tình cảnh giai cấp lao động ở Anh", false], ["Tuyên ngôn của Đảng Cộng sản", true], ["Những nguyên lý của chủ nghĩa cộng sản", false]]}, {"q": "Đối tượng nghiên cứu của chủ nghĩa xã hội khoa học là gì?", "a": [["Là những quy luật và tính quy luật chính trị – xã hội của quá trình phát sinh, hình thành và phát triển hình thái kinh tế - xã hội cộng sản chủ nghĩa.", true], ["Là những quy luật hình thành, phát triển và hoàn thiện của các hình thái kinh tế - xã hội.", false], ["Là những quy luật và tính quy luật chính trị – xã hội của quá trình phát sinh, hình thành và phát triển hình thái kinh tế - xã hội chủ nghĩa xã hội.", false], ["Là những quy luật hình thành, phát triển và hoàn thiện của các nhà nước.", false]]}, {"q": "Ai đã đưa ra quan niệm “CNXH là sự phản kháng và đấu tranh chống sự bóc lột người lao động, một cuộc đấu tranh nhằm hoàn toàn xoá bỏ sự bóc lột”?", "a": [["S.Phuriê", false], ["C.Mác", false], ["Ph.Ănghen", false], ["V.I.Lênin", true]]}, {"q": "Ai được coi là người mở đầu các trào lưu xã hội chủ nghĩa và cộng sản chủ nghĩa thời cận đại?", "a": [["Tômađô Campanenla", false], ["Tômát Morơ", true], ["Arítxtốt", false], ["Platôn", false]]}, {"q": "Tư tưởng về “Giang sơn ngàn năm của Chúa” xuất hiện ở thời đại nào?", "a": [["Công xã nguyên thuỷ", false], ["Thời cổ đại", true], ["Thời cận đại", false], ["Thời phục hưng", false]]}, {"q": "Những nhà tư tưởng tiêu biểu của chủ nghĩa xã hội không tưởng phê phán đầu thế kỷ XIX là ai?", "a": [["Grắccơ Babớp, Xanh Ximông, SáLơ Phuriê", false], ["Xanh Ximông, SáLơ Phuriê, G. Mably", false], ["Xanh Ximông, SáLơ Phuriê, R.Oen", true], ["Xanh Ximông, Giăng Mêliê, R.Oen", false]]}, {"q": "Nhà tư tưởng xã hội chủ nghĩa không tưởng nào đã nói đến vấn đề giai cấp và xung đột giai cấp?", "a": [["Xanh Ximông", true], ["SáLơ Phuriê", false], ["Rôbớt Ôoen", false], ["Grắccơ Babớp", false]]}, {"q": "Nhà tư tưởng xã hội chủ nghĩa nào đã tố cáo quá trình tích luỹ tư bản chủ nghĩa bằng hình ảnh “cừu ăn thịt người”?", "a": [["Tômát Morơ", true], ["SáLơ Phuriê", false], ["Rôbớt Ôoen", false], ["Grắccơ Babớp", false]]}, {"q": "Ai đã nêu ra tư tưởng: trình độ giải phóng xã hội được đo bằng trình độ giải phóng phụ nữ?", "a": [["Xanh Ximông", false], ["SáLơ Phuriê", true], ["Grắccơ Babớp", false], ["Rôbớt Ôoen", false]]}, {"q": "Nhà tư tưởng xã hội chủ nghĩa nào đã tiến hành thực nghiệm xã hội cộng sản trong lòng xã hội tư bản?", "a": [["Xanh Ximông", false], ["SáLơ Phuriê", false], ["Grắccơ Babớp", false], ["Rôbớt Ôoen", true]]}, {"q": "Tác phẩm “Tuyên ngôn của những người bình dân” là của ai?", "a": [["Tomát Morơ", false], ["Tômađô Campanenla", false], ["Giắccơ Babớp", true], ["SáLơ Phuriê", false]]}, {"q": "Nguyên nhân chủ yếu của những hạn chế của chủ nghĩa xã hội không tưởng là?", "a": [["Do trình độ nhận thức của những nhà tư tưởng", false], ["Do khoa học chưa phát triển", false], ["Do những điều kiện lịch sử khách quan quy định", true], ["Do lực lượng sản xuất chưa phát triển", false]]}, {"q": "Nội dung cơ bản nhất mà nhờ đó chủ nghĩa xã hội từ không tưởng trở thành khoa học là gì?", "a": [["Lên án mạnh mẽ chủ nghĩa tư bản", false], ["Phản ánh đúng khát vọng của nhân dân lao động bị áp bức", false], ["Phát hiện ra giai cấp công nhân là lực lượng xã hội có thể thủ tiêu CNTB, xây dựng CNXH", true], ["Chỉ ra sự cần thiết phải thay thế chủ nghĩa tư bản bằng chủ nghĩa xã hội", false]]}, {"q": "Ph. Ăngghen đã đánh giá: “Hai phát hiện vĩ đại này đã đưa chủ nghĩa xã hội trở thành một khoa học”. Hai phát kiến đó là gì?", "a": [["Chủ nghĩa duy vật biện chứng và chủ nghĩa duy vật lịch sử", false], ["Sứ mệnh lịch sử của giai cấp công nhân – Học thuyết giá trị thặng dư", false], ["Học thuyết giá trị thặng dư – Chủ nghĩa duy vật lịch sử", true], ["Sứ mệnh lịch sử của giai cấp công nhân– Chủ nghĩa duy vật lịch sử", false]]}, {"q": "Vì sao chủ nghĩa xã hội khoa học theo nghĩa rộng là chủ nghĩa Mác - Lênin?", "a": [["Vì chủ nghĩa xã hội khoa học đã phác thảo ra mô hình chủ nghĩa xã hội và chủ nghĩa cộng sản", false], ["Vì chủ nghĩa xã hội khoa học đã luận chứng về sứ mệnh lịch sử của giai cấp công nhân hiện đại", false], ["Vì chủ nghĩa xã hội khoa học dựa vào triết học, kinh tế chính trị để lý giải tính tất yếu lịch sử của cách mạng xã hội chủ nghĩa và Hình thái kinh tế – xã hội cộng sản chủ nghĩa gắn liền với vai trò lãnh đạo của giai cấp công nhân", true], ["Vì chủ nghĩa xã hội khoa học là một bộ phận của chủ nghĩa Mác – Lênin", false]]}, {"q": "Những yếu tố tư tưởng XHCN được xuất hiện từ khi nào ?", "a": [["Chế độ tư bản chủ nghĩa ra đời", false], ["Sự xuất hiện chế độ tư hữu, xuất hiện giai cấp thống trị và bóc lột", true], ["Sự xuất hiện giai cấp công nhân", false], ["Ngay từ thời công xã nguyên thuỷ", false]]}, {"q": "Phát hiện nào sau đây của C. Mác và Ph. Ăngghen?", "a": [["Chủ nghĩa duy vật lịch sử", false], ["Học thuyết giá trị thặng dư", false], ["Sứ mệnh lịch sử của giai cấp công nhân", false], ["Chủ nghĩa duy vật lịch sử, học thuyết giá trị thặng dư, sứ mệnh lịch sử của giai cấp công nhân", true]]}, {"q": "Chủ nghĩa duy vật lịch sử và học thuyết giá trị thặng dư đã được C. Mác phát triển và trình bày một cách có hệ thống trong tác phẩm nào?", "a": [["Hệ tư tưởng Đức", false], ["Tình cảnh của giai cấp lao động ở Anh", false], ["Bộ Tư bản", true], ["Những nguyên lý của chủ nghĩa cộng sản", false]]}, {"q": "Ai là người đầu tiên đưa chủ nghĩa xã hội từ khoa học thành thực tiễn sinh động?", "a": [["C.Mác", false], ["Ph.Ănghen", false], ["V.I. Lênin", true], ["Hồ Chí Minh", false]]}, {"q": "C. Mác và Ph. Ăngghen có rất nhiều tác phẩm kinh điển cho nhân loại. V.I. Lênin đã nghiên cứu tác phẩm “….. ” là cuốn bách khoa thực sự để phát triển chủ nghĩa cộng sản?", "a": [["Sự khốn cùng của triết học", false], ["Chống Đuy rinh", true], ["Đấu tranh giai cấp ở Pháp", false], ["Tuyên ngôn của Đảng cộng sản", false]]}, {"q": "Tiêu chí nào dùng để phân loại các tư tưởng xã hội chủ nghĩa?", "a": [["Theo lịch đại", false], ["Theo trình độ phát triển tư tưởng", false], ["Kết hợp tính lịch đại với trình độ phát triển", true], ["Theo sự phát triển của con người", false]]}, {"q": "Nguyên nhân nào dẫn đến những hạn chế mà các trào lưu xã hội chủ nghĩa và cộng sản chủ nghĩa không tưởng mắc phải?", "a": [["Điều kiện sản xuất tư bản chủ nghĩa chưa phát triển đầy đủ", true], ["Do nhận thức của các nhà nghiên cứu xã hội chưa đầy đủ", false], ["Do các lực lượng của giai cấp tư sản ngăn cấm họ nghiên cứu", false], ["Điều kiện khoa học xã hội và khoa học tự nhiên chưa phát triển", false]]}, {"q": "Khi nghiên cứu về chủ nghĩa cộng sản, có một tác phẩm được coi là “cuốn bách khoa toàn thư thực sự của chủ nghĩa cộng sản”, là tác phẩm:", "a": [["Sự khốn cùng của triết học", false], ["Chống Đuy rinh", true], ["Đấu tranh giai cấp ở Pháp", false], ["Tuyên ngôn của Đảng cộng sản", false]]}, {"q": "Phạm trù nào được coi là cơ bản nhất, là xuất phát điểm của chủ nghĩa xã hội khoa học?", "a": [["Giai cấp công nhân", false], ["Sứ mệnh lịch sử của giai cấp công nhân", true], ["Chuyên chính vô sản", false], ["Xã hội chủ nghĩa", false]]}, {"q": "Trong quá trình sản xuất vật chất hiện đại, ai là chủ thể của quá trình đó?", "a": [["Công nhân", true], ["Công nhân, nông dân", false], ["Trí thức", false], ["Công nhân, trí thức", false]]}, {"q": "Thuộc tính cơ bản nào là nguyên nhân chính khiến giai cấp công nhân trở thành đối kháng với giai cấp tư sản?", "a": [["Về phương thức lao động", false], ["Về phương thức sản xuất", false], ["Về vị trí trong quan hệ sản xuất tư bản chủ nghĩa", true], ["Về vai trò trong quan hệ sản xuất tư bản chủ nghĩa", false]]}, {"q": "Xã hội hóa và phân công lao động xã hội mới, các hình thức bóc lột giá trị thặng dư đã làm cho diện mạo của giai cấp công nhân hiện đại như thế nào?", "a": [["Vẫn giống với những mô tả của Mác", false], ["Không còn giống với những mô tả của Mác", true], ["Có thay đổi chút ít với những mô tả của Mác", false], ["Giai cấp công nhân hiện đại không còn bị áp bức bóc lột", false]]}, {"q": "Những biến đổi của giai cấp công nhân hiện đại so với thời kỳ của Mác đã tác động như thế nào đến sứ mệnh của giai cấp công nhân trong xã hội tư bản?", "a": [["Sứ mệnh của giai cấp công nhân không tồn tại", false], ["Sứ mệnh của giai cấp công nhân vẫn tồn tại", true], ["Sứ mệnh của giai cấp công nhân phải thay đổi chút ít", false], ["Sứ mệnh của giai cấp công nhân phải thay đổi hoàn toàn", false]]}, {"q": "Hiện nay, cơ cấu ngành nghề của giai cấp công nhân đã thay đổi to lớn, nền công nghiệp hóa, tự động hóa, áp dụng phổ biến công nghệ thông tin, trí tuệ nhân tạo vào sản xuất. Xét theo thuộc tính kinh tế - xã hội, giai cấp công nhân tồn tại như thế nào?", "a": [["Giai cấp công nhân bị xóa bỏ", false], ["Giai cấp công nhân sẽ bị xóa bỏ", false], ["Giai cấp công nhân vẫn tồn tại không có gì thay đổi", false], ["Giai cấp công nhân vẫn tồn tại như là một giai cấp đặc thù", true]]}, {"q": "Cùng với sự tiến bộ của khoa học công nghệ, giai cấp công nhân có xu hướng “trí thức hóa” ngày càng tăng, trình độ tri thức làm bản chất giai cấp công nhân trong chủ nghĩa tư bản thay đổi như thế nào?", "a": [["Không làm thay đổi bản chất giai cấp công nhân", true], ["Có làm thay đổi bản chất giai cấp công nhân", false], ["Hoàn toàn thay đổi bản chất giai cấp công nhân", false], ["Thay đổi chút ít bản chất giai cấp công nhân", false]]}, {"q": "Câu nói: “Điểm chủ yếu trong học thuyết của Mác là ở chỗ nó làm sáng tỏ vai trò lịch sử của giai cấp vô sản là người xây dựng chủ nghĩa xã hội\" là của ai?", "a": [["Ph. Ăng ghen", false], ["V.I. Lênin", true], ["Hồ Chí Minh", false], ["Stalin", false]]}, {"q": "Do sự phát triển của sản xuất và văn minh, đời sống công nhân ở các nước tư bản chủ nghĩa phát triển đã thay đổi ra sao?", "a": [["Phần đông họ vẫn là những người vô sản trần trụi với hai bàn tay trắng", false], ["Toàn bộ họ vẫn là những người vô sản trần trụi với hai bàn tay trắng", false], ["Phần đông họ không còn là những người vô sản trần trụi với hai bàn tay trắng", true], ["Toàn bộ họ vẫn là những người vô sản không có thay đổi gì so với giai đoạn trước", false]]}, {"q": "Công nhân nước nào là đứa con đầu lòng của nền công nghiệp hiện đại?", "a": [["Mỹ", false], ["Anh", true], ["Pháp", false], ["Đức", false]]}, {"q": "Những người làm công ăn lương phục vụ trong các ngành như y tế, giáo dục, văn hóa, dịch vụ (không liên quan trực tiếp tới sản xuất công nghiệp). Họ được gọi là gì?", "a": [["Là những người lao động nói chung và được công nhận là công nhân", false], ["Là những người lao động nói chung, được thu hút vào tổ chức công đoàn nghề nghiệp, nhưng không phải là công nhân", true], ["Là những người lao động nói chung, nếu được thu hút vào tổ chức công đoàn nghề nghiệp, thì là công nhân", false], ["Là những người lao động nói chung, không được thu hút vào tổ chức công đoàn nghề nghiệp, thì không phải là công nhân", false]]}, {"q": "Sau khi cách mạng vô sản thành công, giai cấp công nhân sẽ thay đổi về địa vị xã hội như thế nào?", "a": [["Giai cấp vẫn bị bóc lột", false], ["Giai cấp bị trị trong xã hội", false], ["Giai cấp thống trị", true], ["Không thay đổi gì", false]]}, {"q": "Trải qua thời kỳ quá độ rất lâu dài khi xây dựng thành công chủ nghĩa cộng sản, bản thân giai cấp công nhân biến đổi thế nào?", "a": [["Sẽ không còn là một giai cấp riêng biệt", true], ["Sẽ không có thay đổi gì", false], ["Sẽ vẫn là một giai cấp riêng biệt, đặc thù", false], ["Sẽ vẫn là một giai cấp nhưng chia làm nhiều hình thức khác nhau", false]]}, {"q": "Ở Việt Nam cuối thế kỷ XIX, đầu thế kỷ XX giai cấp công nhân trước hết phải làm cuộc cách mạng gì?", "a": [["Cách mạng 3.0", false], ["Cách mạng 4.0", false], ["Cách mạng xóa bỏ giai cấp", false], ["Cách mạng dân tộc dân chủ nhân dân", true]]}, {"q": "Giai đoạn thực hiện cách mạng dân tộc dân chủ nhân dân, giai cấp công nhân Việt Nam thực hiện sứ mệnh là lãnh đạo cuộc cách mạng thông qua lực lượng nào?", "a": [["Thông qua giai cấp nông nhân", false], ["Thông qua tầng lớp trí thức", false], ["Thông qua đội tiên phong của mình", true], ["Thông qua giai cấp tư sản", false]]}, {"q": "Giai cấp nào sản sinh ra người đào huyệt chôn giai cấp tư sản?", "a": [["Giai cấp nông dân", false], ["Tầng lớp trí thức", false], ["Giai cấp tư sản", true], ["Giai cấp công nhân", false]]}, {"q": "Một số phần tử cơ hội, xét lại đang phủ nhận thuyết Mác – Lênin về sứ mệnh lịch sử của giai cấp công nhân, họ nhận định giai cấp công nhân ngày nay thế nào?", "a": [["Đã “teo đi”, đã “tan biến” vào giai tầng xã hội khác", true], ["Đã “phình lên”, đã “kết tinh” thành giai cấp công nhân hùng mạnh", false], ["Đã phát triển để trở thành giai cấp thống trị", false], ["Đã lụi tàn và trở thành giai cấp bị trị khốc liệt hơn", false]]}, {"q": "Thời đại ngày nay là thời đại của nền “văn minh trí tuệ”, của “kinh tế tri thức” do vậy lực lượng nào mới là lực lượng tiền phong, có vai trò lãnh đạo cách mạng?", "a": [["Trí thức", false], ["Công nhân", true], ["Nông dân", false], ["Tư sản", false]]}, {"q": "Trong xã hội, trí thức được gọi là gì?", "a": [["Giai cấp đặc biệt", false], ["Giai cấp thuần nhất", false], ["Tầng lớp xã hội đặc biệt và không thuần nhất", true], ["Tầng lớp xã hội đặc biệt và thuần nhất", false]]}, {"q": "Trí thức theo và chịu ảnh hưởng hệ tư tưởng của giai cấp nào?", "a": [["Giai cấp công nhân", false], ["Giai cấp tư sản", false], ["Giai cấp công nhân và nông dân", false], ["Giai cấp mà nó phục vụ", true]]}, {"q": "Trong phương thức sản xuất tư bản chủ nghĩa và trong chế độ tư bản chủ nghĩa, mâu thuẫn giữa giai cấp công nhân (giai cấp vô sản) và giai cấp tư sản thể hiện như thế nào?", "a": [["Được dung hòa lợi ích theo khuôn khổ pháp luật", false], ["Được dung hòa lợi ích theo thỏa thuận giai cấp", false], ["Có thể được hóa giải và điều hòa mâu thuẫn", false], ["Tính chất đối kháng không thể điều hòa", true]]}, {"q": "Cuộc bãi công của 600 thợ nhuộm ở Chợ Lớn năm 1922, Nguyễn Ái Quốc nhận định như thế nào?", "a": [["Đó mới chỉ là “do bản năng tự vệ”", true], ["Được giác ngộ chủ nghĩa Mác – Lênin", false], ["Đó là sự tự giác của ý thức chính trị", false], ["Được tác động bởi Quốc tế cộng sản và phong trào công nhân thế giới", false]]}, {"q": "Giai cấp công nhân Việt Nam, tuyệt đại bộ phận xuất thân từ giai cấp, tầng lớp nào trong xã hội?", "a": [["Từ tiểu tư sản", false], ["Từ binh lính", false], ["Từ nông dân và những tầng lớp lao động khác", true], ["Từ trí thức nghèo, thất nghiệp và người lao động nghèo, buôn bán nhỏ ở thành thị", false]]}, {"q": "Theo Lênin, nội dung của thời đại hiện nay là gì?", "a": [["Xoá bỏ chủ nghĩa tư bản và xây dựng chủ nghĩa xã hội", false], ["Xoá bỏ giai cấp tư sản và chế độ tư bản chủ nghĩa, thiết lập những cơ sở của xã hội mới là xã hội chủ nghĩa và cộng sản chủ nghĩa", true], ["Thiết lập những cơ sở của xã hội mới là xã hội xã hội chủ nghĩa và cộng sản chủ nghĩa", false], ["Xác lập địa vị thống trị của giai cấp công nhân và nhân dân lao động", false]]}, {"q": "Sự sụp đổ của chế độ chủ nghĩa xã hội ở Liên Xô và Đông Âu đã làm cho thời đại ngày nay thay đổi như thế nào?", "a": [["Tính chất và nội dung của thời đại hiện nay có thay đổi", false], ["Tính chất và nội dung của thời đại hiện nay không thay đổi", true], ["Tính chất của thời đại hiện nay có thay đổi", false], ["Nội dung của thời đại hiện nay có thay đổi", false]]}, {"q": "Trong những mâu thuẫn cơ bản của thời đại hiện nay, mâu thuẫn nào là nổi bật, xuyên suốt thời đại mang tính toàn cầu?", "a": [["Mâu thuẫn giữa chủ nghĩa xã hội và chủ nghĩa tư bản", true], ["Mâu thuẫn giữa tư bản và lao động", false], ["Mâu thuẫn giữa các dân tộc thuộc địa và phụ thuộc với chủ nghĩa đế quốc", false], ["Mâu thuẫn giữa các nước tư bản với nhau", false]]}, {"q": "Đặc điểm của giai cấp công nhân là gì?", "a": [["Là giai cấp bị thống trị", false], ["Là giai cấp lao động trong nền sản xuất công nghiệp có trình độ kỹ thuật và công nghệ hiện đại của xã hội", true], ["Là giai cấp đông đảo trong dân cư", trí, vai trò khác nhau và không có điểm chung để liên hệ gắn bó với nhau", true]]}, {"q": "Cơ cấu xã hội - giai cấp trong thời kỳ quá độ lên CNXH biến đổi theo hướng nào?", "a": [["Ổn định và không xuất hiện các tầng lớp xã hội mới", false], ["Ổn định và xuất hiện rất ít các tầng lớp xã hội mới", false], ["Phức tạp, đa dạng, xuất hiện các tầng lớp xã hội mới", true], ["Phức tạp, đa dạng, không xuất hiện các tầng lớp xã hội mới", false]]}, {"q": "Lực lượng nào giữ vai trò chủ đạo, tiên phong trong cơ cấu xã hội – giai cấp thời kỳ quá độ lên CNXH?", "a": [["Đội ngũ trí thức", false], ["Đội ngũ doanh nhân", false], ["Giai cấp nông dân", false], ["Giai cấp công nhân", true]]}, {"q": "Nội dung nào không phải là mục tiêu để giai cấp công nhân phải liên minh với giai cấp nông dân và các tầng lớp nhân dân lao động trong cách mạng xã hội chủ nghĩa?", "a": [["Tập hợp lực lượng thực hiện những nhu cầu và lợi ích chung", false], ["Tạo ra sức mạnh tổng hợp bảo đảm cho thắng lợi của cuộc cách mạng XHCN", false], ["Cuộc đấu tranh này không trở thành “bài đơn ca ai điếu”", false], ["Đoàn kết là một thủ đoạn trong từng giai đoạn của cuộc cách mạng", true]]}, {"q": "Một trong những đặc điểm nổi bật của cơ cấu xã hội – giai cấp trong thời kỳ quá độ lên CNXH ở Việt Nam:", "a": [["Biến đổi cơ cấu - xã hội chi phối những biến đổi của cơ cấu kinh tế trong TKQĐ lên CNXH ở Việt Nam", false], ["Biến đổi phức tạp, đa dạng không tuân theo quy luật của xã hội Việt Nam", false], ["Biến đổi vừa đảm bảo tính quy luật, vừa mang tính đặc thù của xã hội Việt Nam", true], ["Biến đổi có tính chất cơ hội và tạm thời theo yêu cầu của từng giai đoạn cách mạng", false]]}, {"q": "Liên minh công nhân – nông dân – trí thức được xem là?", "a": [["Hạt nhân của khối đại đoàn kết toàn dân tộc và là động lực của sự nghiệp công nghiệp hóa, hiện đại hóa", true], ["Nền tảng của khối đại đoàn kết toàn dân tộc và là động lực của sự nghiệp công nghiệp hóa, hiện đại hóa", false], ["Nền tảng của khối đại đoàn kết toàn dân tộc và là cõ sở để phát triển xã hội", false], ["Nền tảng của khối đại đoàn kết toàn dân tộc và là mục tiêu của quá trình xây dựng chủ nghĩa xã hội", false]], "n": "Các văn kiện thường gọi liên minh này là \"nền tảng\" của khối đại đoàn kết toàn dân tộc, nên phương án bắt đầu bằng \"Nền tảng ... động lực\" cũng có thể đúng. Hãy đối chiếu giáo trình."}, {"q": "Trong thời kỳ quá độ lên CNXH, đội ngũ nào có đóng góp tích cực vào việc thực hiện chiến lược phát triển kinh tế – xã hội, giải quyết việc làm cho người lao động?", "a": [["Giai cấp công nhân", false], ["Đội ngũ thanh niên", false], ["Đội ngũ trí thức", false], ["Đội ngũ doanh nhân", true]]}, {"q": "Trong thời kỳ quá độ lên CNXH ở Việt Nam, để tạo môi trường và điều kiện thúc đẩy biến đổi cơ cấu xã hội – giai cấp theo hướng tích cực cần phải làm gì?", "a": [["Đẩy mạnh công nghiệp hóa, hiện đại hóa; giải quyết tốt mối quan hệ tăng trưởng kinh tế với đảm bảo công bằng xã hội", true], ["Tăng trưởng kinh tế phải gắn với phát triển văn hóa", false], ["Quan tâm thích đáng và phù hợp với mỗi giai cấp, tầng lớp trong xã hội.", false], ["Cải thiện đời sống tinh thần cho nhân dân", false]]}, {"q": "Chính sách của Đảng, Nhà nước phát huy vai trò của thế hệ trẻ trong sự nghiệp xây dựng và bảo vệ Tổ quốc nhằm mục tiêu gì?", "a": [["Tạo môi trường và điều kiện thuận lợi cho họ học tập, nghiên cứu, lao động giải trí, phát triển trí tuệ, kỹ năng, thể lực", true], ["Đảm bảo việc làm, nâng cao thu nhập, cải thiện điều kiện làm việc, nhà ở", false], ["Khuyến khích chuyển dịch cơ cấu lao động, tiếp nhận và ứng dụng tiến bộ khoa học – công nghệ", false], ["Đào tạo nhân tài", false]]}, {"q": "Trong tiến trình đẩy mạnh CNH, HĐH đất nước và hội nhập quốc tế, đội ngũ trí thức có vai trò như thế nào?", "a": [["Là lực lượng đi đầu", false], ["Là lực lượng giữ vị trí tiên phong", false], ["Là lực lượng lao động sáng tạo đặc biệt quan trọng", true], ["Là lực lượng đối đầu với giai cấp công nhân", false]]}, {"q": "Đội ngũ tri thức có vị tr "q": "Trong một quốc gia đa tộc người thì vấn đề gì cần giải quyết được coi là có ý nghĩa cơ bản nhất để thực hiện quyền bình đẳng giữa các dân tộc?", "a": [["Ban hành hệ thống hiến pháp và pháp luật về quyền bình đẳng giữa các dân tộc", false], ["Chống tư tưởng phân biệt chủng tộc, kì thị và chia rẽ dân tộc", false], ["Nâng cao trình độ dân trí, văn hoá cho đồng bào", false], ["Xoá bỏ dần sự chênh lệch về mọi mặt giữa các dân tộc do lịch sử để lại", true]]}, {"q": "Đặc trưng nổi bật trong quan hệ giữa các dân tộc ở nước ta là?", "a": [["Là sự phân bố đan xen nhau, không một dân tộc nào có lãnh thổ riêng", false], ["Là sự cố kết dân tộc, hoà hợp dân tộc trong một cộng đồng đa dạng nhưng thống nhất", true], ["Là có sự chênh lệch về trình độ phát triển kinh tế - xã hội giữa các dân tộc", false], ["Là các dân tộc có bản sắc văn hoá riêng, đa dạng, phong phú", false]]}, {"q": "Nghị quyết “Về phát huy sức mạnh đại đoàn kết dân tộc vì dân giàu nước mạnh, xã hội công bằng, dân chủ, văn minh” được đề cập đến ở Hội nghị Trung ương nào?", "a": [["Hội nghị Trung ương II khoá VII", false], ["Hội nghị Trung ương V khoá VIII", false], ["Hội nghị Trung ương VI khoá VIII", false], ["Hội nghị Trung ương VII khoá IX", true]]}, {"q": "Để tăng cường, củng cố khối đại đoàn kết dân tộc ở nước ta hiện nay thì chính sách cụ thể nào của Đảng và Nhà nước ta được coi là vấn đề cực kỳ quan trọng?", "a": [["Tôn trọng lợi ích, truyền thống, văn hoá của các dân tộc", false], ["Phát huy truyền thống đoàn kết giữa các dân tộc", false], ["Phát triển kinh tế hàng hoá ở các vùng dân tộc thiểu số", true], ["Tăng cường bồi dưỡng, đào tạo đội ngũ cán bộ là người dân tộc thiểu số", false]]}, {"q": "Hãy tìm ý đúng trong các phương án dưới đây. Trong Văn kiện Đại hội Đại biểu toàn quốc lần thứ IX, Đảng Cộng sản Việt Nam đã nêu rõ điều gì?", "a": [["Vấn đề dân tộc có vai trò quan trọng đối với sự nghiệp phát triển kinh tế - xã hội ở nước ta hiện nay", false], ["Vấn đề dân tộc và đoàn kết các dân tộc luôn có  nay có khoảng bao nhiêu tôn giáo và bao nhiêu tín đồ đăng kí hoạt động?", "a": [["6 tôn giáo với khoảng 30 triệu tín đồ", false], ["13 tôn giáo với khoảng 24 triệu tín đồ", true], ["6 tôn giáo với khoảng 15 triệu tín đồ", false], ["6 tôn giáo với khoảng 10 triệu tín đồ", false]], "n": "Số liệu tôn giáo và tín đồ thay đổi theo từng năm; đáp án này theo số liệu cũ của file gốc."}, {"q": "Điền từ còn thiếu vào chỗ trống: “Tôn giáo là một hình thái ý thức – xã hội phản ánh một cách hoang đường, hư ảo…… khách quan”?", "a": [["Thực tiễn", false], ["Hiện thực", true], ["Điều kiện", false], ["Cuộc sống", false]]}, {"q": "Giữa chủ nghĩa Mác – Lênin và hệ tư tưởng tôn giáo khác nhau ở điểm nào?", "a": [["Về thế giới quan", false], ["Về nhân sinh quan", false], ["Về con đường mưu cầu hạnh phúc cho nhân dân", false], ["Về thế giới quan, nhân sinh quan và con đường mưu cầu hạnh phúc cho nhân dân", true]]}, {"q": "Tính lịch sử của tôn giáo được thể hiện trong nội dung nào sau đây?", "a": [["Tôn giáo tồn tại trong một giai đoạn lịch sử nhất định", false], ["Tôn giáo vận động và phát triển trong giai đoạn tư duy và nhận thức con người chưa cao", false], ["Tôn giáo chỉ tồn tại trong tư duy con người", false], ["Tôn giáo có sự hình thành, tồn tại và phát triển trong những giai đoạn lịch sử nhất định, nó có khả năng biến đổi để thích nghi với nhiều chế độ chính trị - xã hội", true]]}, {"q": "Liên hiệp công - nông các dân tộc phản ánh sự thống nhất giữa?", "a": [["Giải phóng dân tộc và giải phóng giai cấp", true], ["Giải phóng xã hội và giải phóng giai cấp", false], ["Giải phóng con người và giải phóng giai cấp", false], ["Giải phóng lao động và giải phóng giai cấp", false]]}, {"q": "Cương lĩnh dân tộc của chủ nghĩa Mác - Lênin là cơ sở lý luận quan trọng để các Đảng Cộng sản vận dụng thực hiện chính sách dân tộc trong quá trình đấu tranh giành?", "a": [["Độc lập dân tộc và xây dựng chủ nghĩa tư bản", false], ["Độc lập dân tộc và giải phóng xã hội", false], ["Độc lập dân tộc và xây dựng chủ nghĩa xã hội", true], ["Độc lập dân tộc và xây dựng xã hội mới", false]]}, {"q": "Yếu tố nào sau đây là nhân tố quyết định sự tồn tại và phát triển của các hình thái ý thức xã hội, trong đó có tôn giáo?", "a": [["Đấu tranh giai cấp", false], ["Sản xuất vật chất và các quan hệ kinh tế", true], ["Sự mâu thuẫn của các quan hệ xã hội", false], ["Quá trình đấu tranh giữa các lực lượng trong xã hội", false]]}, {"q": "Điền từ còn thiếu vào chỗ trống: Đảng và Nhà nước ta luôn quan tâm đến chính sách dân tộc, xem đó là vấn đề chính trị - xã hội rộng lớn và toàn diện gắn liền với các mục tiêu trong thời kỳ quá độ lên?", "a": [["Xã hội phong kiến", false], ["Xã hội nô lệ", false], ["Xã hội phong kiến tư bản", false], ["Chủ nghĩa xã hội", true]]}, {"q": "Đảng và Nhà nước xác định nội dung cốt lõi của công tác tôn giáo là gì?", "a": [["Vận động quần chúng", true], ["Vấn đề truyền đạo và theo đạo", false], ["Trách nhiệm công dân", false], ["Tinh thần dân tộc", false]]}, {"q": "Chính sách dân tộc cơ bản của Đảng và Nhà nước ta được thể hiện trên những lĩnh vực nào?", "a": [["Chính trị, kinh tế, văn hóa, tôn giáo", false], ["Chính trị, kinh tế, văn hóa, xã hội, an ninh quốc phòng", true], ["Chính trị, kinh tế, xã hội", false], ["Chính trị, kinh tế, an ninh quốc phòng, giáo dục, y tế", false]]}, {"q": "Các loại hình tín ngưỡng hiện nay bao gồm?", "a": [["Thờ cúng tổ tiên", false], ["Thờ anh hùng dân tộc", false], ["Thờ Mẫu", false], ["Thờ cúng tổ tiên, thờ anh hùng dân tộc, thờ Mẫu", true]]}, {"q": "Chọn đáp án đúng: “Là niềm tin của con người vào các lực lượng siêu nhiên, thần thánh đến mức độ mê muội, cuồng tín, dẫn đến những hành vi cực đoan, sai lệch quá mức, trái với các giá trị văn hóa, pháp luật gây tổn hại cho cá nhân, xã hội và cộng đồng”?", "a": [["Mê tín", false], ["Mê tín dị đoan", true], ["Khoa học", false], ["Tôn giáo", false]]}, {"q": "Tôn trọng tự do tín ngưỡng tôn giáo cũng chính là tôn trọng quyền con người, thể hiện bản chất ưu việt của chế độ?", "a": [["Xã hội nguyên thủy", false], ["Xã hội nô lệ", false], ["Xã hội phong kiến", false], ["Xã hội chủ nghĩa", true]]}, {"q": "Theo quan điểm của chủ nghĩa Mác – Lênin, bản chất của tôn giáo được hiểu như thế nào?", "a": [["Tôn giáo là một hiện tượng xã hội – văn hóa do con người sáng tạo ra", true], ["Tôn giáo là hình ảnh chủ quan phản ánh thế giới khách quan", false], ["Tôn giáo phản ánh văn hóa cộng đồng", false], ["Tôn giáo phản ánh hoạt động sống của con người", false]]}, {"q": "Giải quyết mối quan hệ dân tộc và tôn giáo phải đặt trong mối quan hệ với cộng đồng quốc gia – dân tộc thống nhất theo định hướng nào?", "a": [["Phong kiến", false], ["Xã hội chủ nghĩa", true], ["Tư bản chủ nghĩa", false], ["Tư bản", false]]}, {"q": "Trong các mối quan hệ xã hội thì quan hệ nào là những quan hệ hết sức nhạy cảm, quy định lẫn nhau?", "a": [["Dân tộc, tôn giáo, xã hội", false], ["Dân tộc, xã hội", false], ["Dân tộc, tôn giáo và nhân quyền", true], ["Dân tộc, nhân quyền", false]]}, {"q": "Theo chủ nghĩa Mác - Lênin hội, sự phát triển các hình thức cộng đồng người được bắt đầu và kết thúc bởi?", "a": [["Thị tộc, Dân tộc", true], ["Bộ tộc, Thị tộc", false], ["Thị tộc, Bộ lạc", false], ["Thị tộc, Liên minh thị tộc", false]]}, {"q": "Sự biến đổi của cộng đồng dân tộc là do biến đổi của yếu tố nào?", "a": [["Lực lượng sản xuất", false], ["Phương thức sản xuất", true], ["Quan hệ sản xuất", false], ["Xã hội", false]]}, {"q": "Ở phương Đông, dân tộc được hình thành trên cơ sở nào?", "a": [["Một nền văn hóa phát triển", false], ["Một nền văn hóa, tâm lý dân tộc đã phát triển", true], ["Chính trị đã ổn định", false], ["Nền kinh tế đang phát triển", false]]}, {"q": "Ở phương Tây, dân tộc xuất hiện khi phương thức sản xuất tư bản chủ nghĩa được xác lập thay thế phương thức sản xuất nào?", "a": [["Cộng sản nguyên thủy", false], ["Chiếm hữu nô lệ", false], ["Phong kiến", true], ["Xã hội chủ nghĩa", false]]}, {"q": "Khái niệm lãnh thổ của một quốc gia bao gồm?", "a": [["Vùng đất, vùng biển, vùng trời", false], ["Vùng đất, vùng biển, vùng trời, vùng sông hồ", false], ["Vùng đất, vùng biển, vùng trời, vùng rừng núi", false], ["Vùng đất, vùng biển, vùng trời, hải đảo", true]], "n": "Đáp án trong file gốc là \"hải đảo\", nhưng định nghĩa phổ biến còn nhắc vùng nước và lòng đất. Hãy đối chiếu giáo trình."}, {"q": "Đối với các quốc gia có nhiều tộc người thì tính thống nhất trong đa dạng văn hóa là đặc trưng của?", "a": [["Nền văn hóa dân tộc", true], ["Nền kinh tế", false], ["Nền giáo dục", false], ["Văn hóa tộc người", false]]}, {"q": "Về nguồn gốc nhận thức của tôn giáo, khi khoảng cách giữa “biết” và “chưa biết” vẫn tồn tại, những điều khoa học chưa giải thích được, thì điều đó thường được giải thích thông qua?", "a": [["Lăng kính các tôn giáo", true], ["Các đấng siêu nhiên", false], ["Hoạt động mê tín", false], ["Niềm tin cá nhân", false]]}, {"q": "Tôn trọng tự do tín ngưỡng thể hiện bản chất ưu việt của chế độ Xã hội chủ nghĩa là xuất phát từ việc?", "a": [["Tôn trọng quyền tự do", false], ["Tôn trọng quyền văn hóa", false], ["Tôn trọng quyền sống", false], ["Tôn trọng quyền con người", true]]}, {"q": "Trong xã hội công xã nguyên thủy, tín ngưỡng tôn giáo chỉ biểu hiện thuần túy về?", "a": [["Kinh tế", false], ["Chính trị", false], ["Tư tưởng", true], ["Văn hoá", false]]}, {"q": "Tăng cường mối quan hệ tốt đẹp giữa dân tộc và tôn giáo tạo sự đồng thuận, đoàn kết dân tộc, đoàn kết tôn giáo nhằm xây dựng một nước Việt Nam?", "a": [["Dân giàu, nước mạnh, dân chủ, công bằng, văn minh", true], ["Dân giàu, nước mạnh, công bằng, dân chủ, văn minh", false], ["Giàu đẹp", false], ["Phồn thịnh", false]]}, {"q": "Khái niệm dân tộc hiện nay được hiểu ở mấy nghĩa?", "a": [["Một nghĩa", false], ["Hai nghĩa", true], ["Ba nghĩa", false], ["Bốn nghĩa", false]]}, {"q": "Phát biểu nào sau là sai: Các dân tộc ở Việt Nam...?", "a": [["Có sự chênh lệch về số dân giữa các tộc người", false], ["Cư trú xen kẽ nhau", false], ["Có sự mâu thuẫn với nhau", true], ["Có trình độ phát triển không đều", false]]}, {"q": "Nhiều nhà sáng lập ra các tôn giáo lớn, như Phật Thích Ca, Chúa Giê su, Nhà tiên tri Môhamét..., vốn là những con người tự nhiên - con người thực, nhưng qua lăng kính nào mà họ trở thành những Đấng siêu nhiên?", "a": [["Tôn giáo", true], ["Chính trị", false], ["Đạo đức", false], ["Triết học", false]]}, {"q": "Một số tôn giáo, thông qua các giáo thuyết, và các hành vi cực đoan khác, đã kìm hãm con người trên phương diện cơ bản nào?", "a": [["Nhận thức và khả năng vươn lên", true], ["Hành động và khả năng vươn lên", false], ["Học tập và khả năng vươn lên", false], ["Rèn luyện và khả năng vươn lên", false]]}, {"q": "Khái niệm Gia đình nào sau đây đúng?", "a": [["Gia đình là một cộng đồng người đặc biệt, có vai trò quyết định đến sự tồn tại và phát triển của xã hội", false], ["Gia đình là một cộng đồng người, có vai trò quyết định đến sự tồn tại và phát triển của xã hội", false], ["Gia đình là một hình thức cộng đồng xã hội đặc biệt, được hình thành, duy trì và củng cố chủ yếu dựa trên cơ sở hôn nhân, quan hệ huyết thống và quan hệ nuôi dưỡng, cùng với những quy định về quyền và nghĩa vụ của các thành viên trong gia đình", true], ["Gia đình là một hình thái cộng đồng xã hội đặc biệt, được hình thành, duy trì và củng cố chủ yếu dựa trên cơ sở hôn nhân, quan hệ huyết thống và quan hệ nuôi dưỡng, cùng với những quy định về quyền và nghĩa vụ của các thành viên trong gia đình", false]]}, {"q": "Theo C.Mác và Ph.Ăngghen, cơ sở hình thành gia đình bao gồm những mối quan hệ cơ bản nào?", "a": [["Quan hệ nuôi dưỡng và quan hệ huyết thống", false], ["Quan hệ hôn nhân và quan hệ huyết thống", false], ["Quan hệ nuôi dưỡng và quan hệ hôn nhân", false], ["Quan hệ nuôi dưỡng, quan hệ hôn nhân và quan hệ huyết thống", true]]}, {"q": "Để hình thành nên các mối quan hệ khác trong gia đình cần có quan hệ cơ sở, nền tảng. Vậy quan hệ nào sau đây là quan hệ nền tảng?", "a": [["Quan hệ huyết thống", false], ["Quan hệ nuôi dưỡng", false], ["Quan hệ họ hàng", false], ["Quan hệ hôn nhân", true]]}, {"q": "Ngoài quan hệ huyết thống, hiện nay, tại Việt Nam cũng như trên thế giới còn thừa nhận quan hệ gia đình nào khác?", "a": [["Người mang thai hộ và con mang thai hộ", false], ["Quan hệ cha mẹ nuôi – con nuôi", true], ["Quan hệ ông bà – cháu", false], ["Quan hệ dì, cậu, chú, bác – cháu", false]]}, {"q": "Quan hệ nào trong gia đình vừa thể hiện trách nhiệm, nghĩa vụ, vừa là một quyền lợi thiêng liêng giữa các thành viên trong gia đình?", "a": [["Quan hệ huyết thống", false], ["Quan hệ hôn nhân", false], ["Quan hệ họ hàng", false], ["Quan hệ nuôi dưỡng", true]]}, {"q": "Khi nói về vị trí của gia đình, một nhà triết học đã phát biểu như sau: “Theo quan điểm duy vật thì nhân tố quyết định trong lịch sử, suy cho đến cùng, là sản xuất và tái sản xuất ra đời sống trực tiếp….” Bạn hãy cho biết, phát biểu trên của nhà triết học nào?", "a": [["C. Mác", false], ["Ph.Ăngghen", true], ["V.I.Lênin", false], ["Hegel", false]]}, {"q": "Trong xã hội dựa trên chế độ tư hữu về tư liệu sản xuất thì quan hệ xã hội và quan hệ gia đình tất yếu sẽ dẫn đến điều gì?", "a": [["Sự bình đẳng", false], ["Sự ổn định", false], ["Sự bất bình đẳng", true], ["Sự tôn trọng và bảo vệ", false]]}, {"q": "Chức năng cơ bản và đặc thù của gia đình là gì?", "a": [["Tái sản xuất ra sản phẩm", false], ["Tái sản xuất ra con người", true], ["Tái sản xuất xã hội, vì gia đình là tế bào của xã hội", false], ["Tái sản xuất ra các giá trị văn hóa truyền thống", false]]}, {"q": "Yếu tố nào sau đây KHÔNG thuộc chế độ hôn nhân tiến bộ?", "a": [["Hôn nhân tự nguyện", false], ["Hôn nhân một vơ một chồng, vợ chồng bình đẳng", false], ["Hôn nhân được đảm bảo về pháp lí", false], ["Hôn nhân được sắp đặt bởi cha mẹ", true]]}, {"q": "Quy mô của gia đình Việt Nam đang thay đổi theo xu hướng nào sau đây?", "a": [["Gia đình hai thế hệ - gia đình ba thế hệ", false], ["Gia đình tứ đại đồng đường", false], ["Gia đình nhiều thế hệ", false], ["Gia đình hai thế hệ", true]]}, {"q": "Vì sao nói việc thực hiện chức năng tái sản xuất ra con người không chỉ là việc riêng của từng gia đình mà là vấn đề xã hội?", "a": [["Xã hội có ảnh hưởng đến sự phát triển chung của gia đình", false], ["Vì gia đình là tế bào của xã hội, gia đình có tốt thì xã hội mới hưng thịnh và phát triển", true], ["Vì việc sản xuất ra con người là một hiện tượng xã hội đặc biệt", false], ["Vì ảnh hưởng đến dân số quốc gia", false]]}, {"q": "Chức năng nào của gia đình có ảnh hưởng lâu dài và toàn diện đến cuộc đời của mỗi thành viên?", "a": [["Chức năng kinh tế và tổ chức tiêu dùng", false], ["Chức năng thỏa mãn nhu cầu tâm sinh lý, duy trì tình cảm gia đình", false], ["Chức năng tái sản xuất ra con người", false], ["Chức năng nuôi dưỡng, giáo dục", true]]}, {"q": "Chủ tịch Hồ Chí Minh từng khẳng định:“Nếu không giải phóng phụ nữ là xây dựng chủ nghĩa xã hội chỉ một nữa.” Thông điệp của Bác được hiểu như thế nào?", "a": [["Phụ nữ là thành viên không thể thiếu trong việc xây dựng và phát triển xã hội", false], ["Giai cấp cầm quyền muốn quản lí xã hội theo yêu cầu của mình, phải coi trọng việc xây dựng và củng cố gia đình", true], ["Giúp phụ nữ thoát khỏi chế độ phong kiến, gia trưởng lạc hậu", false], ["Phụ nữ cần tham gia điều hành chính quyền", false]], "n": "Đáp án được tô trong file gốc không khớp rõ với nội dung câu hỏi, có thể file gốc bị lệch đáp án."}, {"q": "Ngoài việc giáo dục nhân cách để trẻ hình thành quan điểm giáo dục tốt, gia đình còn là nơi trẻ học được việc hoạch định tương lai cho bản thân, điều này phụ thuộc vào chức năng nào?", "a": [["Chức năng kinh tế và tổ chức tiêu dùng", true], ["Chức năng thỏa mãn nhu cầu tâm sinh lý, duy trì tình cảm gia đình", false], ["Chức năng tái sản xuất ra con người", false], ["Chức năng nuôi dưỡng, giáo dục", false]]}, {"q": "Hôn nhân tự nguyện KHÔNG bao gồm yếu tố nào sau đây?", "a": [["Xuất phát từ tình yêu giữa nam và nữ", false], ["Không chấp nhận sự áp đặt của cha mẹ", false], ["Không bác bỏ việc cha mẹ quan tâm giúp đỡ con cái có trách ue]]}, {"q": "Quan điểm của người Việt là gia đình phải có đông con, đặc biệt là con trai. Quan điểm này do ảnh hưởng từ điều gì?", "a": [["Do phong tục, tập quán và nhu cầu sản xuất nông nghiệp", true], ["Do chế độ phong kiến áp đặt", false], ["Do sự thiếu hiểu biết", false], ["Do quan điểm cá nhân", false]]}, {"q": "“...nhiều gia đình cộng lại mới thành xã hội, xã hội tốt thì gia đình càng tốt, gia đình tốt thì xã hội mới tốt. Hạt nhân của xã hội chính là gia đình”, phát biểu trên của ai khi nói về vị trí của gia đình?", "a": [["C. Mác", false], ["Ph.Ăngghen", false], ["V.I.Lênin", false], ["Hồ Chí Minh", true]]}, {"q": "Hiện nay, xã hội Việt Nam nói riêng và thế giới nói chung ngày càng xuất hiện nhiều hiện tượng mà trước đây chưa hề có hoặc ít có như: bạo lực gia đình, li hôn, li thân, ngoại tình, sống thử,….Điều này bắt nguồn từ nguyên nhân nào?", "a": [["Biến đổi quan hệ vợ chồng", false], ["Biến đổi quan hệ giữa các thế hệ, các giá trị, chuẩn mực văn hóa của gia đình", true], ["Biến đổi chức năng thỏa mãn nhu cầu tâm sinh lí, duy trì tình cảm", false], ["Biến đổi quan hệ hôn nhân", false]]}, {"q": "Mâu thuẫn chủ yếu nảy sinh giữa những gia đình có 3 thế hệ là gì?", "a": [["Kinh tế", false], ["Học vấn", false], ["Tuổi tác", false], ["Quan điểm", true]]}, {"q": "Trong thời kỳ quá độ lên chủ nghĩa xã hội ở Việt Nam gia đình ngày càng thu nhỏ, số thành viên ít đi. Đó là sự biến đổi về yếu tố nào?", "a": [["Biến đổi quy mô, kết cấu của gia đình", true], ["Biến đổi các chức năng của gia đình", false], ["Biến đổi kinh tế, tổ chức tiêu dùng", false], ["Biến đổi chức năng giáo dục", false]]}, {"q": "Luật lao động Việt Nam đã thể hiện vai trò quan trọng của gia đình thông qua ngày lễ kỉ niệm gì?", "a": [["Ngày 1/6", false], ["Ngày 5/9", false], ["Ngày 28/6", true], ["Ngày Tết Trung thu", false]]}, {"q": "Quan điểm về hôn nhân tiến bộ ở Việt Nam và trên thế giới?", "a": [["Yêu không cần suy nghĩ", false], ["Yêu có lí trí, tính toán cho tương lai", true], ["Cần có nghề nghiệp ổn định", false], ["Yêu thử, sống thử", false]]}, {"q": "Hiện nay, người trẻ có xu hướng thích hưởng thụ, thích thể hiện bản thân. Điều này ảnh hưởng gì đến việc định hướng hôn nhân sau này?", "a": [["Chọn lựa thiếu thận trọng trong tình yêu", true], ["Yêu vật chất hơn tình yêu chân thành", false], ["Dễ dẫn đến tan vỡ, thất vọng", false], ["Mất phương hướng trong cuộc sống", false]]}, {"q": "Chức năng đặc thù của gia đình và không một cộng đồng nào có thể thay thế, đó là:", "a": [["Tái sản xuất ra sản phẩm", false], ["Tái sản xuất ra con người", true], ["Tái sản xuất xã hội", false], ["Tái sản xuất các giá trị tinh thần", false]]}, {"q": "Đâu không phải là chức năng cơ bản của gia đình?", "a": [["Tái sản xuất ra con người", false], ["Gắn kết giữa cá nhân với xã hội", true], ["Kinh tế và tổ chức tiêu dùng", false], ["Thỏa mãn nhu cầu tâm sinh lý, duy trì tình cảm gia đình", false]]}, {"q": "Chức năng Tái sản xuất ra con người là chức năng gì của gia đình?", "a": [["Cá biệt", false], ["Quan trọng", false], ["Đặc biệt", false], ["Đặc thù", true]]}, {"q": "Gia đình Việt Nam hiện đại chỉ có hai thế hệ là cha mẹ và con cái, số con trong gia đình cũng không nhiều như trước là kết quả của:", "a": [["Do phát triển kinh tế - xã hội", false], ["Do con người tập trung nhiều vào lao động", false], ["Do nhận thức sinh đẻ thay đổi", false], ["Do thực hiện kế hoạch hóa gia đình", true]]}, {"q": "Sự phát triển của khoa học, công nghệ đã có những tác động không nhỏ tới việc giáo dục nói chung và giáo dục tại gia đình nói riêng. Điều này đã giúp việc thực hiện chức năng giáo dục của gia đình?", "a": [["Không thay đổi", false], ["Bị thu hẹp lại", false], ["Ngày càng mở rộng", true], ["Bình thường", false]]}, {"q": "Giáo dục gia đình hiện nay không chỉ nặng về giáo dục đạo đức, ứng xử trong gia đình, dòng họ, làng xã, mà hướng đến giáo dục", "a": [["Ngoại ngữ", false], ["Công nghệ thông tin", false], ["Kỹ năng mềm", false], ["Kiến thức khoa học hiện đại, trang bị công cụ để con cái hòa nhập với thế giới", true]]}];
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const cfg={from:1,n:0,mode:'test'};
let S=null;
const LET='ABCD';

function home(){
app.innerHTML=`<div class="logo" onclick="home()">Đố Vui</div>
<section class="hero"><h1>Ôn tập Chủ nghĩa xã hội khoa học</h1><p>${Q.length} câu trắc nghiệm, làm lần lượt theo đúng thứ tự trong file.</p></section>
<div class="card"><h3>Phạm vi</h3><div class="row">
<label>Bắt đầu từ câu <input type="number" id="fr" min="1" max="${Q.length}" value="${cfg.from}" onchange="cfg.from=Math.min(Q.length,Math.max(1,+this.value||1));this.value=cfg.from;upd()"></label>
<label>Số câu <select id="n" onchange="cfg.n=+this.value;upd()">${[0,10,20,30,50,100].map(v=>`<option value="${v}" ${cfg.n===v?'selected':''}>${v?v+' câu':'Đến hết'}</option>`).join('')}</select></label></div></div>
<div class="card"><h3>Chế độ</h3>
<label class="r"><input type="radio" name="m" value="test" ${cfg.mode=='test'?'checked':''} onchange="cfg.mode=this.value"><span>Kiểm tra<small>Chấm điểm cuối bài, sau đó xem lại các câu sai.</small></span></label>
<label class="r"><input type="radio" name="m" value="prac" ${cfg.mode=='prac'?'checked':''} onchange="cfg.mode=this.value"><span>Luyện tập<small>Biết đúng hoặc sai ngay sau mỗi câu.</small></span></label></div>
<div class="row"><button class="btn" onclick="start()">Bắt đầu làm bài</button><span id="inf" style="color:var(--mut);font-weight:700"></span></div>`;
upd();
}
function cnt(){const r=Q.length-cfg.from+1;return cfg.n&&cfg.n<r?cfg.n:r}
function upd(){const el=document.getElementById('inf');if(el)el.textContent=`Sẽ làm ${cnt()} câu, từ câu ${cfg.from}`}
function start(){
const pool=Q.slice(cfg.from-1,cfg.from-1+cnt());
S={i:0,mode:cfg.mode,l:pool.map((q,k)=>({no:cfg.from+k,q:q.q,n:q.n,o:q.a.map(a=>({t:a[0],ok:a[1]})),pick:-1}))};
show();
}
function show(){
const x=S.l[S.i],N=S.l.length,last=S.i==N-1;
app.innerHTML=`<div class="hud"><span class="pill">Câu ${S.i+1}/${N}</span><span class="pill">Câu số ${x.no} trong file</span></div>
<div class="bar"><i style="width:${S.i/N*100}%"></i></div>
<div class="qbox"><h2>${esc(x.q)}</h2></div>
<div class="ans">${x.o.map((o,k)=>`<button class="a" onclick="pick(${k})"><b>${LET[k]}</b><span>${esc(o.t)}</span></button>`).join('')}</div>
<div id="fb" role="status"></div>
<div class="row" style="margin-top:14px">${S.i>0&&S.mode=='test'?'<button class="btn g" onclick="S.i--;show()">Câu trước</button>':''}<button class="btn" onclick="nx()">${last?'Nộp bài':'Câu tiếp theo'}</button></div>`;
if(x.pick>=0)mark();
}
function pick(k){
const x=S.l[S.i];
if(S.mode=='prac'&&x.pick>=0)return;
x.pick=k;mark();
}
function mark(){
const x=S.l[S.i],bs=document.querySelectorAll('.a');
bs.forEach((b,k)=>{b.classList.remove('sel','ok','bad');
if(S.mode=='test'){if(k==x.pick)b.classList.add('sel')}
else{b.disabled=true;if(x.o[k].ok)b.classList.add('ok');else if(k==x.pick)b.classList.add('bad')}});
if(S.mode=='prac'){const ok=x.o[x.pick].ok;
document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}">${ok?'Chính xác!':'Chưa đúng. Đáp án đúng: '+LET[x.o.findIndex(o=>o.ok)]}</div>${x.n?`<div class="fb nt">Lưu ý: ${esc(x.n)}</div>`:''}`}
}
function nx(){S.i++;S.i>=S.l.length?result():show()}

function result(){
const N=S.l.length,right=S.l.filter(x=>x.pick>=0&&x.o[x.pick].ok).length,skip=S.l.filter(x=>x.pick<0).length;
const sc=Math.round(right/N*100)/10,wrong=S.l.filter(x=>!(x.pick>=0&&x.o[x.pick].ok));
app.innerHTML=`<div class="logo" onclick="home()">Đố Vui</div>
<div style="text-align:center"><h2>${right==N?'Tuyệt đối, đúng hết!':sc>=8?'Rất tốt!':sc>=5?'Khá ổn, ôn thêm chút nữa':'Cần ôn lại thêm'}</h2><div class="big">${sc}<small style="font-size:26px;color:var(--mut)">/10</small></div></div>
<div class="stats"><div class="stat"><b>${right}/${N}</b>Câu đúng</div><div class="stat"><b>${N-right-skip}</b>Câu sai</div><div class="stat"><b>${skip}</b>Bỏ qua</div></div>
<div class="row" style="margin:16px 0"><button class="btn" onclick="start()">Làm lại</button><button class="btn g" onclick="home()">Chọn lại phạm vi</button></div>
${wrong.length?`<h3 style="margin-bottom:10px">Các câu cần xem lại (${wrong.length})</h3>`+wrong.map(x=>`<div class="rv"><p>Câu ${x.no}: ${esc(x.q)}</p>
${x.pick>=0?`<div class="w">Bạn chọn: ${esc(x.o[x.pick].t)}</div>`:'<div class="w">Bạn chưa trả lời</div>'}
<div class="c">Đáp án đúng: ${esc(x.o.find(o=>o.ok).t)}</div>${x.n?'<div style="margin-top:4px;font-weight:600">Lưu ý: '+esc(x.n)+'</div>':''}</div>`).join(''):''}`;
window.scrollTo(0,0);
}
home();
</script>
</body>
</html>
